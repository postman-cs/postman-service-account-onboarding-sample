type: http
name: Get pet by id
url: '{{baseUrl}}/pets/:petId'
method: GET
headers:
  - key: Accept
    value: application/json
pathVariables:
  - key: petId
    value: string
examples:
  - response:
      statusCode: 200
      statusText: OK
      body:
        type: json
        content: |-
          {
            "id": "ada8b961-78fd-b511-524a-61a230649e01",
            "name": "string",
            "tag": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: OK
  - response:
      statusCode: 404
      statusText: Not Found
      body:
        type: text
        content: ''
    name: Not found
