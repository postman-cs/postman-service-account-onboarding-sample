type: http
name: Create a pet
url: '{{baseUrl}}/pets'
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: Accept
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "string",
      "tag": "string"
    }
