      body:
        type: json
        content: |-
          {
            "id": "0f128665-c5fc-3326-9fd1-ee1c2a8a770b",
            "name": "string",
            "tag": "string"
          }
      headers:
        - key: Content-Type
          value: application/json
    name: Created
