# Internal service-account beta onboarding. GitHub-hosted runners cannot reach beta
# (api.getpostman-beta.com, dl-cli.pstmn-beta.io) without Postman Access; use a self-hosted
# runner on an enrolled machine (Warp). See repo README.
#
# Secrets: POSTMAN_API_KEY (prod PMAK for onboarding; see README). Optional: POSTMAN_BETA_API_KEY
# for beta mint only. Optional repo variable: POSTMAN_ONBOARDING_SPEC_URL (see README).
#
# Bootstrap skips dl-cli.pstmn.io when `postman` is already on PATH — we install the beta-baked
# CLI from dl-cli.pstmn-beta.io first so login hits beta /me.

name: Postman API onboarding

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  onboard:
    runs-on: [self-hosted, postman-cse]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Postman Access (beta API reachable)
        run: |
          set -euo pipefail
          curl -sS -o /tmp/pm-access-probe "https://api.getpostman-beta.com/me" || true
          if head -c 300 /tmp/pm-access-probe | grep -qiE 'cloudflare|sign in'; then
            echo "::error::Beta API returned HTML (likely outside Postman Access). Use a Warp-enrolled self-hosted runner."
            head -c 400 /tmp/pm-access-probe || true
            exit 1
          fi
          rm -f /tmp/pm-access-probe
          echo "Probe OK (not Cloudflare interstitial)."

      - name: Install Postman CLI (beta channel)
        run: |
          set -euo pipefail
          # Beta CLI is typically pre-installed on the postman-cse runner to avoid
          # per-run sudo for /usr/local/bin. Fall back to curl-install if a beta-baked
          # binary isn't already on PATH (e.g., first run on a fresh runner).
          if command -v postman >/dev/null 2>&1 && postman --version 2>/dev/null | grep -q beta; then
            echo "Using pre-installed beta CLI: $(postman --version)"
          else
            curl -fsSL https://dl-cli.pstmn-beta.io/install/unix.sh | sh
            postman --version
          fi

      - name: Mint Postman service account access token
        id: postman_token
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_BETA_API_KEY: ${{ secrets.POSTMAN_BETA_API_KEY }}
        run: |
          set -euo pipefail
          # Beta mint: prefer POSTMAN_BETA_API_KEY; otherwise reuse POSTMAN_API_KEY (must be valid on beta).
          MINT_KEY="${POSTMAN_BETA_API_KEY:-}"
          if [ -z "${MINT_KEY}" ]; then
            MINT_KEY="${POSTMAN_API_KEY:-}"
          fi
          if [ -z "${MINT_KEY}" ]; then
            echo "::error::Set POSTMAN_BETA_API_KEY (beta PMAK for mint) and/or POSTMAN_API_KEY."
            exit 1
          fi

          # New shape: POST { "apiKey": "<PMAK>" } -> { "access_token": "..." }
          # (Older shape returned .session.token + .session.identity.team; kept as fallback.)
          MINT_URL="https://api.getpostman-beta.com/service-account-tokens"
          MINT_BODY="$(jq -nc --arg k "${MINT_KEY}" '{apiKey:$k}')"
          HTTP_CODE="$(
            curl -sS -o mint_response.json -w "%{http_code}" -X POST "${MINT_URL}" \
              -H "Content-Type: application/json" \
              --data "${MINT_BODY}"
          )"
          RESPONSE="$(cat mint_response.json)"
          rm -f mint_response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::service-account-tokens failed (HTTP ${HTTP_CODE})"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          TOKEN="$(echo "${RESPONSE}" | jq -r '.access_token // .session.token // empty')"
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Mint succeeded but no access token in response"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

          # Mint response no longer carries team id; resolve it from /me.
          ME_URL="https://api.getpostman-beta.com/me"
          ME_CODE="$(
            curl -sS -o me_response.json -w "%{http_code}" "${ME_URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "x-api-key: ${MINT_KEY}"
          )"
          ME_BODY="$(cat me_response.json)"
          rm -f me_response.json
          if [ "${ME_CODE}" -lt 200 ] || [ "${ME_CODE}" -ge 300 ]; then
            echo "::error::/me failed (HTTP ${ME_CODE})"
            echo "${ME_BODY}" | jq . 2>/dev/null || echo "${ME_BODY}"
            exit 1
          fi
          TEAM_ID="$(echo "${ME_BODY}" | jq -r '
            .user.teamId
            // .user.team
            // .teamId
            // .team.id
            // .team
            // .identity.team
            // .session.identity.team
            // empty
          ')"
          if [ -z "${TEAM_ID}" ] || [ "${TEAM_ID}" = "null" ]; then
            echo "::error::Could not read team id from /me response"
            echo "${ME_BODY}" | jq . 2>/dev/null || echo "${ME_BODY}"
            exit 1
          fi
          echo "team_id=${TEAM_ID}" >> "${GITHUB_OUTPUT}"

      # postman-bootstrap-action loads spec-url via safe HTTPS fetch only: no userinfo
      # (credentials in the URL -> CONTRACT_SPEC_FETCH_BLOCKED). It does not send GitHub
      # Authorization headers, so anonymous raw.githubusercontent.com 404s on private repos.
      # Optional repo variable POSTMAN_ONBOARDING_SPEC_URL = public HTTPS URL to the same OpenAPI.
      - name: Resolve spec-url for bootstrap
        id: spec_url
        env:
          OVERRIDE: ${{ vars.POSTMAN_ONBOARDING_SPEC_URL }}
          GH_REPO: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "${OVERRIDE:-}" ]; then
            echo "url=${OVERRIDE}" >> "${GITHUB_OUTPUT}"
            echo "Using repo variable POSTMAN_ONBOARDING_SPEC_URL."
          else
            echo "url=https://raw.githubusercontent.com/${GH_REPO}/${GH_SHA}/openapi.yaml" >> "${GITHUB_OUTPUT}"
            echo "Using default raw URL (works when this repository is public)."
          fi

      - name: Verify spec-url is reachable without credentials
        env:
          SPEC_URL: ${{ steps.spec_url.outputs.url }}
        run: |
          set -euo pipefail
          CODE="$(curl -sS -o /dev/null -w "%{http_code}" -A "postman-bootstrap-action" "${SPEC_URL}")"
          if [ "${CODE}" != "200" ]; then
            echo "::error::spec-url returned HTTP ${CODE}. Bootstrap forbids credentials in URLs, so private-repo raw URLs cannot work. Set repository variable POSTMAN_ONBOARDING_SPEC_URL to a public HTTPS URL that serves openapi.yaml (mirror, gist raw, or make the repo public)."
            exit 1
          fi

      # The composite action resolves beta API, Bifrost, gateway, observability, and CLI hosts from postman-stack.
      - name: Require Postman API key
        env:
          PMAK: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${PMAK:-}" ]; then
            echo "::error::POSTMAN_API_KEY must be set to a PMAK valid on the chosen Postman stack."
            exit 1
          fi

      - name: Postman API onboarding
        uses: postman-cs/postman-api-onboarding-action@v0.13.0
        with:
          project-name: sample-pet-store-github-demo
          spec-url: ${{ steps.spec_url.outputs.url }}
          spec-path: openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_BETA_API_KEY || secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.postman_token.outputs.token }}
          postman-team-id: ${{ steps.postman_token.outputs.team_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-ci-workflow: 'false'
          postman-stack: beta
