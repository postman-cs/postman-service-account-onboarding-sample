# Sample: mint a short-lived Postman service-account session token via API key,
# then pass it to postman-api-onboarding-action for Bifrost-backed steps.
#
# Repository secrets (GitHub → Settings → Secrets):
#   POSTMAN_API_KEY — API key for the service account (mint endpoint + bootstrap/sync).
#   POSTMAN_CLI_RUST_GITHUB_TOKEN — PAT with repo contents read on postman-cs/postman-cli-rust
#     (needed to download the private release binary; default GITHUB_TOKEN cannot access sibling private repos).
#
# postman-team-id is taken from the mint response (.session.identity.team, or .identity.team).
#
# Note: spec-url uses raw.githubusercontent.com; that URL must be reachable by Postman
# (public repo or equivalent). Private repos need a hosted spec URL Postman can fetch.

name: Postman API onboarding

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    env:
      POSTMAN_CLI_RUST_VERSION: v1.32.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mint Postman service account access token
        id: postman_token
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POSTMAN_API_KEY:-}" ]; then
            echo "::error::POSTMAN_API_KEY is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          MINT_URL="https://api.getpostman-beta.com/service-account-tokens"
          HTTP_CODE="$(
            curl -sS -o mint_response.json -w "%{http_code}" -X POST "${MINT_URL}" \
              -H "x-api-key: ${POSTMAN_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}'
          )"
          RESPONSE="$(cat mint_response.json)"
          rm -f mint_response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::service-account-tokens failed (HTTP ${HTTP_CODE})"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          TOKEN="$(echo "${RESPONSE}" | jq -r '.session.token // empty')"
          TEAM_ID="$(echo "${RESPONSE}" | jq -r '.session.identity.team // .identity.team // empty')"
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Mint succeeded (HTTP ${HTTP_CODE}) but response had no .session.token"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          if [ -z "${TEAM_ID}" ] || [ "${TEAM_ID}" = "null" ]; then
            echo "::error::Could not read team id (.session.identity.team or .identity.team) from mint response"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "team_id=${TEAM_ID}" >> "${GITHUB_OUTPUT}"

      - name: Install Postman CLI (Rust fork)
        env:
          GH_TOKEN: ${{ secrets.POSTMAN_CLI_RUST_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Set Actions secret POSTMAN_CLI_RUST_GITHUB_TOKEN (PAT with read access to postman-cs/postman-cli-rust releases)."
            exit 1
          fi
          gh release download "${POSTMAN_CLI_RUST_VERSION}" \
            -R postman-cs/postman-cli-rust \
            -p 'postman-cli-linux-x64' \
            -D /tmp/postman-cli-rust
          sudo install -m 0755 /tmp/postman-cli-rust/postman-cli-linux-x64 /usr/local/bin/postman
          postman --version

      - name: Postman API onboarding
        uses: postman-cs/postman-api-onboarding-action@main
        with:
          project-name: sample-pet-store-github-demo
          spec-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/openapi.yaml
          spec-path: openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.postman_token.outputs.token }}
          postman-team-id: ${{ steps.postman_token.outputs.team_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-ci-workflow: 'false'
          org-mode: 'false'
