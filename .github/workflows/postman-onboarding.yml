# Internal service-account beta onboarding. GitHub-hosted runners cannot reach beta
# (api.getpostman-beta.com, dl-cli.pstmn-beta.io) without Postman Access; use a self-hosted
# runner on an enrolled machine (Warp). See repo README.
#
# Secrets: POSTMAN_API_KEY only.
#
# Bootstrap skips dl-cli.pstmn.io when `postman` is already on PATH — we install the beta-baked
# CLI from dl-cli.pstmn-beta.io first so login hits beta /me.

name: Postman API onboarding

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  onboard:
    runs-on: [self-hosted, postman-service-account-beta]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Postman Access (beta API reachable)
        run: |
          set -euo pipefail
          curl -sS -o /tmp/pm-access-probe "https://api.getpostman-beta.com/me" || true
          if head -c 300 /tmp/pm-access-probe | grep -qiE 'cloudflare|sign in'; then
            echo "::error::Beta API returned HTML (likely outside Postman Access). Use a Warp-enrolled self-hosted runner."
            head -c 400 /tmp/pm-access-probe || true
            exit 1
          fi
          rm -f /tmp/pm-access-probe
          echo "Probe OK (not Cloudflare interstitial)."

      - name: Install Postman CLI (beta channel)
        run: |
          set -euo pipefail
          curl -fsSL https://dl-cli.pstmn-beta.io/install/unix.sh | sh
          postman --version

      - name: Mint Postman service account access token
        id: postman_token
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POSTMAN_API_KEY:-}" ]; then
            echo "::error::POSTMAN_API_KEY is not set."
            exit 1
          fi

          # New shape: POST { "apiKey": "<PMAK>" } -> { "access_token": "..." }
          # (Older shape returned .session.token + .session.identity.team; kept as fallback.)
          MINT_URL="https://api.getpostman-beta.com/service-account-tokens"
          MINT_BODY="$(jq -nc --arg k "${POSTMAN_API_KEY}" '{apiKey:$k}')"
          HTTP_CODE="$(
            curl -sS -o mint_response.json -w "%{http_code}" -X POST "${MINT_URL}" \
              -H "Content-Type: application/json" \
              --data "${MINT_BODY}"
          )"
          RESPONSE="$(cat mint_response.json)"
          rm -f mint_response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::service-account-tokens failed (HTTP ${HTTP_CODE})"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          TOKEN="$(echo "${RESPONSE}" | jq -r '.access_token // .session.token // empty')"
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Mint succeeded but no access token in response"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"

          # Mint response no longer carries team id; resolve it from /me.
          ME_URL="https://api.getpostman-beta.com/me"
          ME_CODE="$(
            curl -sS -o me_response.json -w "%{http_code}" "${ME_URL}" \
              -H "Authorization: Bearer ${TOKEN}" \
              -H "x-api-key: ${POSTMAN_API_KEY}"
          )"
          ME_BODY="$(cat me_response.json)"
          rm -f me_response.json
          if [ "${ME_CODE}" -lt 200 ] || [ "${ME_CODE}" -ge 300 ]; then
            echo "::error::/me failed (HTTP ${ME_CODE})"
            echo "${ME_BODY}" | jq . 2>/dev/null || echo "${ME_BODY}"
            exit 1
          fi
          TEAM_ID="$(echo "${ME_BODY}" | jq -r '
            .user.teamId
            // .user.team
            // .teamId
            // .team.id
            // .team
            // .identity.team
            // .session.identity.team
            // empty
          ')"
          if [ -z "${TEAM_ID}" ] || [ "${TEAM_ID}" = "null" ]; then
            echo "::error::Could not read team id from /me response"
            echo "${ME_BODY}" | jq . 2>/dev/null || echo "${ME_BODY}"
            exit 1
          fi
          echo "team_id=${TEAM_ID}" >> "${GITHUB_OUTPUT}"

      # Bootstrap fetches spec-url with plain HTTP (no GitHub headers). Anonymous
      # raw.githubusercontent.com returns 404 for private repos — embed GITHUB_TOKEN.
      - name: Postman API onboarding
        uses: postman-cs/postman-api-onboarding-action@main
        with:
          project-name: sample-pet-store-github-demo
          spec-url: https://x-access-token:${{ github.token }}@raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/openapi.yaml
          spec-path: openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.postman_token.outputs.token }}
          postman-team-id: ${{ steps.postman_token.outputs.team_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-ci-workflow: 'false'
          org-mode: 'false'
