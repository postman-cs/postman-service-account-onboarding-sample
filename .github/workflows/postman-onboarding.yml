# Sample: mint service-account session token, build mainline postman-eng/postman-cli with a
# CI login patch, then run postman-api-onboarding-action.
#
# Secrets:
#   POSTMAN_API_KEY — service account key (mint + Postman APIs).
#   POSTMAN_ENG_CLI_CHECKOUT_TOKEN — PAT with repo read on postman-eng/postman-cli (private).
#
# POSTMAN_CHANNEL=beta selects lib/config/cli-environment/beta (api.getpostman-beta.com, etc.).
# POSTMAN_SERVICE_ACCOUNT_SESSION_TOKEN (mint output) makes `postman login --with-api-key` skip
# /me validation and store the minted access token (see scripts/patch-postman-cli-ci-login.js).

name: Postman API onboarding

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  onboard:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      POSTMAN_CHANNEL: beta
    steps:
      - name: Checkout sample repo
        uses: actions/checkout@v4

      - name: Checkout Postman CLI (postman-eng)
        uses: actions/checkout@v4
        with:
          repository: postman-eng/postman-cli
          ref: develop
          path: postman-cli-src
          token: ${{ secrets.POSTMAN_ENG_CLI_CHECKOUT_TOKEN }}

      - name: Setup Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Patch and build Postman CLI
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/scripts/patch-postman-cli-ci-login.js" "${GITHUB_WORKSPACE}/postman-cli-src"
          cd "${GITHUB_WORKSPACE}/postman-cli-src"
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Install postman on PATH
        run: |
          set -euo pipefail
          POSTMAN_JS="${GITHUB_WORKSPACE}/postman-cli-src/dist/bin/postman.js"
          test -f "$POSTMAN_JS"
          printf '%s\n' '#!/usr/bin/env bash' "exec node \"${POSTMAN_JS}\" \"\$@\"" | sudo tee /usr/local/bin/postman > /dev/null
          sudo chmod +x /usr/local/bin/postman
          postman --version

      - name: Mint Postman service account access token
        id: postman_token
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POSTMAN_API_KEY:-}" ]; then
            echo "::error::POSTMAN_API_KEY is not set."
            exit 1
          fi
          MINT_URL="https://api.getpostman-beta.com/service-account-tokens"
          HTTP_CODE="$(
            curl -sS -o mint_response.json -w "%{http_code}" -X POST "${MINT_URL}" \
              -H "x-api-key: ${POSTMAN_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}'
          )"
          RESPONSE="$(cat mint_response.json)"
          rm -f mint_response.json
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::service-account-tokens failed (HTTP ${HTTP_CODE})"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          TOKEN="$(echo "${RESPONSE}" | jq -r '.session.token // empty')"
          TEAM_ID="$(echo "${RESPONSE}" | jq -r '.session.identity.team // .identity.team // empty')"
          if [ -z "${TOKEN}" ] || [ "${TOKEN}" = "null" ]; then
            echo "::error::Mint succeeded but no .session.token"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          if [ -z "${TEAM_ID}" ] || [ "${TEAM_ID}" = "null" ]; then
            echo "::error::Could not read team id from mint response"
            echo "${RESPONSE}" | jq . 2>/dev/null || echo "${RESPONSE}"
            exit 1
          fi
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "${GITHUB_OUTPUT}"
          echo "team_id=${TEAM_ID}" >> "${GITHUB_OUTPUT}"

      - name: Postman API onboarding
        uses: postman-cs/postman-api-onboarding-action@main
        env:
          POSTMAN_SERVICE_ACCOUNT_SESSION_TOKEN: ${{ steps.postman_token.outputs.token }}
        with:
          project-name: sample-pet-store-github-demo
          spec-url: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/openapi.yaml
          spec-path: openapi.yaml
          postman-api-key: ${{ secrets.POSTMAN_API_KEY }}
          postman-access-token: ${{ steps.postman_token.outputs.token }}
          postman-team-id: ${{ steps.postman_token.outputs.team_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          generate-ci-workflow: 'false'
          org-mode: 'false'
